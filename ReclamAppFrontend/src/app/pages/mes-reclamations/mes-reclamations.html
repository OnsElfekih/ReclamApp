<div class="container mt-4">
  <div class="card p-4">
    <h3>Mes réclamations</h3>

    <p class="text-danger" *ngIf="error">
      {{ error }}
    </p>

    <a routerLink="/client-reclamations/add" class="btn btn-primary mb-3">
      Ajouter une réclamation
    </a>
    <div
      *ngIf="reclamationToDelete"
      class="alert alert-danger d-flex justify-content-between align-items-center"
    >
      <span>
        Voulez-vous supprimer la réclamation
        <strong>{{ reclamationToDelete.produit }}</strong> ?
      </span>

      <div>
        <button class="btn btn-danger btn-sm me-2" (click)="deleteReclamation()">Oui</button>
        <button class="btn btn-secondary btn-sm" (click)="cancelDelete()">Annuler</button>
      </div>
    </div>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Produit</th>
          <th>Description</th>
          <th>Statut</th>
          <th>Date</th>
          <th>Note</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of reclamations">
          <td>{{ r.produit }}</td>
          <td>{{ r.description }}</td>
          <td>{{ r.statut }}</td>
          <td>{{ r.date }}</td>
          <td>{{ r.note }}</td>
          <td>
            <a
              [routerLink]="['/client-reclamations/edit', r.id]"
              class="btn btn-warning btn-sm me-2"
            >
              Modifier
            </a>

            <button class="btn btn-danger btn-sm" (click)="confirmDeleteReclamation(r)">
              Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
