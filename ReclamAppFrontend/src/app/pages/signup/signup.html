<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Créer un compte client</h3>

        <p class="text-success" *ngIf="message">
          {{ message }}
        </p>

        <p class="text-danger" *ngIf="error">
          {{ error }}
        </p>

        <form #signupForm="ngForm" (ngSubmit)="signup()">
          <div class="mb-3">
            <label>Nom</label>
            <input
              type="text"
              class="form-control"
              name="nom"
              [(ngModel)]="client.nom"
              required
              minlength="3"
            />
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input
              type="email"
              class="form-control"
              name="email"
              [(ngModel)]="client.email"
              required
              email
            />
          </div>

          <div class="mb-3">
            <label>Téléphone</label>
            <input
              type="text"
              class="form-control"
              name="telephone"
              [(ngModel)]="client.telephone"
              required
              pattern="^[0-9]{8}$"
            />
          </div>

          <div class="mb-3">
            <label>Mot de passe</label>
            <input
              type="password"
              class="form-control"
              name="motDePasse"
              [(ngModel)]="client.motDePasse"
              required
              minlength="4"
            />
          </div>

          <button type="submit" class="btn btn-success w-100" [disabled]="signupForm.invalid">
            Créer mon compte
          </button>

          <div class="text-center mt-3">
            <a routerLink="/login"> J’ai déjà un compte </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
