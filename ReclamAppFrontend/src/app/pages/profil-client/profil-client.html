<div class="container mt-4">
  <div class="card p-4">
    <h3>Mon profil</h3>

    <p class="text-success" *ngIf="message">
      {{ message }}
    </p>

    <p class="text-danger" *ngIf="error">
      {{ error }}
    </p>

    <form #profilForm="ngForm" (ngSubmit)="updateProfil()">
      <div class="mb-3">
        <label class="form-label">Nom</label>
        <input
          type="text"
          class="form-control"
          name="nom"
          [(ngModel)]="client.nom"
          #nom="ngModel"
          required
          minlength="3"
        />

        <div class="text-danger" *ngIf="nom.invalid && nom.touched">
          <small *ngIf="nom.errors?.['required']">Le nom est obligatoire.</small>
          <small *ngIf="nom.errors?.['minlength']">
            Le nom doit contenir au moins 3 caractères.
          </small>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          name="email"
          [(ngModel)]="client.email"
          #email="ngModel"
          required
          email
        />

        <div class="text-danger" *ngIf="email.invalid && email.touched">
          <small *ngIf="email.errors?.['required']">L'email est obligatoire.</small>
          <small *ngIf="email.errors?.['email']">Format email invalide.</small>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Téléphone</label>
        <input
          type="text"
          class="form-control"
          name="telephone"
          [(ngModel)]="client.telephone"
          #telephone="ngModel"
          required
          pattern="^[0-9]{8}$"
        />

        <div class="text-danger" *ngIf="telephone.invalid && telephone.touched">
          <small *ngIf="telephone.errors?.['required']"> Le téléphone est obligatoire. </small>
          <small *ngIf="telephone.errors?.['pattern']">
            Le téléphone doit contenir exactement 8 chiffres.
          </small>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">
          Nouveau mot de passe
          <small class="text-muted">(optionnel)</small>
        </label>

        <input
          type="password"
          class="form-control"
          name="motDePasse"
          [(ngModel)]="client.motDePasse"
          #motDePasse="ngModel"
          minlength="4"
        />

        <div class="text-danger" *ngIf="motDePasse.invalid && motDePasse.touched">
          <small *ngIf="motDePasse.errors?.['minlength']">
            Le mot de passe doit contenir au moins 4 caractères.
          </small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="profilForm.invalid">
        Enregistrer les modifications
      </button>
    </form>
  </div>
</div>
