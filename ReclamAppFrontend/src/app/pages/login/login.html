<div class="auth-page">
  <div class="auth-card">
    <h3 class="text-center mb-4">Connexion</h3>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" />
    </div>

    <div class="mb-3">
      <label>Mot de passe</label>
      <input type="password" class="form-control" [(ngModel)]="motDePasse" />
    </div>

    <p class="text-danger">{{ error }}</p>

    <button class="btn btn-primary w-100" (click)="login()">Se connecter</button>

    <div class="text-center mt-3">
      <span>Nouveau client ? </span>
      <a routerLink="/signup">Créer un compte</a>
    </div>
  </div>
</div>
