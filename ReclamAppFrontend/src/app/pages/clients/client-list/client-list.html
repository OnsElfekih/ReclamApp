<div class="container mt-4">
  <h3>Liste des clients</h3>

  <p>Nombre de clients : {{ clients.length }}</p>

  <button class="btn btn-primary mb-3" (click)="addClient()">Ajouter client</button>

  <input
    type="text"
    class="form-control mb-3"
    placeholder="Rechercher par nom"
    [(ngModel)]="keyword"
    (input)="onSearchChange()"
  />

  <p class="text-danger" *ngIf="error">
    {{ error }}
  </p>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let client of clients">
        <td>{{ client.id }}</td>
        <td>{{ client.nom }}</td>
        <td>{{ client.email }}</td>
        <td>{{ client.telephone }}</td>

        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="editClient(client.id!)">
            Modifier
          </button>

          <button class="btn btn-danger btn-sm" (click)="confirmDeleteClient(client.id!)">
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div
    *ngIf="clientToDelete"
    class="alert alert-warning d-flex justify-content-between align-items-center"
  >
    <span>
      Confirmer la suppression du client
      <strong>{{ clients.find((c) => c.id === clientToDelete)?.nom }}</strong> ?
    </span>

    <div>
      <button class="btn btn-danger btn-sm me-2" (click)="deleteClient()">Oui</button>

      <button class="btn btn-secondary btn-sm" (click)="clientToDelete = undefined">Annuler</button>
    </div>
  </div>
</div>
