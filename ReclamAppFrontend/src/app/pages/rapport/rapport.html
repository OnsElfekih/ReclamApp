<div class="container mt-4">
  <h3>Rapport des suivis</h3>

  <p>Nombre : {{ suivis.length }}</p>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Réclamation</th>
        <th>Agent</th>
        <th>Action</th>
        <th>Message</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let s of suivis">
        <td>
          <strong>{{ s.reclamation.produit }}</strong
          ><br />
          <small>
            Client : {{ s.reclamation.client.nom }} | Date : {{ s.date | date: 'dd/MM/yyyy HH:mm' }}
          </small>
        </td>

        <td>{{ s.agentSAV.nom }}</td>
        <td>{{ s.action }}</td>
        <td>{{ s.message }}</td>
      </tr>
    </tbody>
  </table>
</div>
