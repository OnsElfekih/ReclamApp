<div class="container mt-4">
  <h3>Rapport des suivis</h3>

  <p>Nombre : {{ suivis.length }}</p>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Réclamation</th>
        <th>Client</th>
        <th>Agent</th>
        <th>Action</th>
        <th>Message</th>
        <th>Date</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let s of suivis">
        <td>{{ s.id }}</td>

        <!-- ID réclamation -->
        <td>{{ s.reclamation.id }}</td>

        <!-- Nom client -->
        <td>{{ s.reclamation.client.nom }}</td>

        <!-- Nom agent -->
        <td>{{ s.agentSAV.nom }}</td>

        <td>{{ s.action }}</td>
        <td>{{ s.message }}</td>
        <td>{{ s.date | date:'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    </tbody>
  </table>
</div>
